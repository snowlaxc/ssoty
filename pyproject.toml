[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssoty"
version = "0.6.0"
description = "Static cross-harness rule coherence auditor for AI coding agents (Claude Code, Codex, ...)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "snowlaxc" }]
keywords = ["agents", "claude-code", "codex", "AGENTS.md", "linter", "coherence", "ssot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
# Core engine (resolver/checks/adopt/sync/...) stays deterministic, dependency-free, and
# offline. ``textual`` powers ONLY the interactive ``adopt`` TUI and is imported LAZILY (inside
# ssoty.tui, never at the top of cli/adopt) so audit/diff/sync/resolve/fix/metrics never pay its
# import cost. >=0.27.0 is the floor: that is the release that introduced ``SelectionList``.
dependencies = ["textual>=0.27.0"]

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.5"]  # optional, more accurate token counts
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.4",
    "black>=24",
    "anyio[trio]>=3",
    "pytest-asyncio>=0.23",
]

[project.scripts]
ssoty = "ssoty.cli:main"

[project.urls]
Homepage = "https://github.com/snowlaxc/ssoty"
Issues = "https://github.com/snowlaxc/ssoty/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ssoty"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Async TUI tests (Textual Pilot) run under auto mode so ``async def test_*`` need no
# per-test ``@pytest.mark.asyncio`` decorator.
asyncio_mode = "auto"

[tool.coverage.run]
source = ["ssoty"]
branch = true
